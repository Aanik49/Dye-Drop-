name: Build Dye Drop Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies & build bundle
        run: |
          npm ci
          npm run build

      - name: Sync built web assets into Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (KitKat API 19 through Android 15 API 35)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            platforms;android-34
            platforms;android-33
            platforms;android-19
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease

      - name: Upload Dye Drop Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DyeDrop-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Dye Drop Release Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: DyeDrop-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
