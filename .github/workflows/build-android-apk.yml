name: Build Dye Drop Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies & build bundle
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Sync built web assets into Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK (API 21 Min / API 35 Compile)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          SDKM=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKM" ]; then
            echo "Using sdkmanager: $SDKM"
            yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "Using pre-installed runner Android SDK at $ANDROID_SDK_ROOT"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Dye Drop Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DyeDrop-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Dye Drop Release Unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: DyeDrop-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
