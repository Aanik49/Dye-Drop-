<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6CEAD9" />
      <stop offset="52%" stop-color="#B6F8EC" />
      <stop offset="76%" stop-color="#65DFB8" />
      <stop offset="100%" stop-color="#229873" />
    </linearGradient>
    <clipPath id="iconFlaskClip">
      <path d="M196 138H316V208L422 414C435 440 417 470 388 470H124C95 470 77 440 90 414L196 208V138Z" />
    </clipPath>
    <linearGradient id="iconFlaskGlass" x1="112" y1="132" x2="408" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="55%" stop-color="#D7F4FF" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#B0E6FA" stop-opacity="0.72" />
    </linearGradient>
    <clipPath id="iconFrameClip">
      <rect width="512" height="512" rx="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconFrameClip)">
    <!-- Pastel Aqua-Mint Scenic Sky & Pine Hills -->
    <rect width="512" height="512" fill="url(#iconBg)" />
    <path d="M0 326L92 224L188 326L284 214L394 328L470 244L512 292V512H0Z" fill="#46C9A5" opacity="0.45" />
    <path d="M0 378Q142 332 274 366T512 356V512H0Z" fill="#239E76" opacity="0.55" />
    <path d="M0 434Q154 398 310 426T512 412V512H0Z" fill="#177A5C" opacity="0.65" />

    <!-- Ground Shadow beneath Flask -->
    <ellipse cx="256" cy="472" rx="176" ry="26" fill="#0F4D42" opacity="0.38" />

    <!-- Floating Bubbles Above Flask Rim -->
    <circle cx="228" cy="76" r="14" fill="#9AF0FF" stroke="#FFFFFF" stroke-width="4.5" opacity="0.92" />
    <circle cx="286" cy="60" r="19" fill="#89EAFF" stroke="#FFFFFF" stroke-width="5" opacity="0.9" />
    <circle cx="266" cy="102" r="9.5" fill="#FFFFFF" opacity="0.88" />

    <!-- Translucent Glass Back Body -->
    <path
      d="M196 138H316V208L422 414C435 440 417 470 388 470H124C95 470 77 440 90 414L196 208V138Z"
      fill="url(#iconFlaskGlass)"
    />

    <!-- Vibrant Layered Waves Inside Flask (Blue -> Golden Yellow -> Magenta Pink) -->
    <g clip-path="url(#iconFlaskClip)">
      <!-- Top Blue Wave -->
      <path d="M60 282Q160 250 256 278T452 272V485H60V282Z" fill="#39B2FF" />
      <path d="M60 282Q160 250 256 278T452 272Q354 294 256 294T60 282Z" fill="#9AE4FF" opacity="0.72" />
      <!-- Middle Golden-Yellow Wave -->
      <path d="M60 334Q170 300 268 332T452 324V485H60V334Z" fill="#FFC929" />
      <path d="M60 368Q174 340 278 368T452 360V485H60V368Z" fill="#FF9F28" opacity="0.58" />
      <!-- Bottom Magenta-Pink Wave -->
      <path d="M60 398Q170 366 268 400T452 392V485H60V398Z" fill="#E942A4" />
      <path d="M60 436Q174 418 278 440T452 432V485H60V436Z" fill="#C92B88" opacity="0.62" />

      <!-- Rising Bubbles Inside Liquid -->
      <circle cx="274" cy="236" r="13" fill="#FFFFFF" opacity="0.58" />
      <circle cx="300" cy="278" r="20" fill="none" stroke="#FFFFFF" stroke-width="5.5" opacity="0.86" />
      <circle cx="206" cy="364" r="11" fill="#FFFFFF" opacity="0.52" />
    </g>

    <!-- Thick Glossy Ice-White Outer Rim & Crisp Teal Ink Contour -->
    <path
      d="M196 138H316V208L422 414C435 440 417 470 388 470H124C95 470 77 440 90 414L196 208V138Z"
      stroke="#E9FBFF"
      stroke-width="15"
      stroke-linejoin="round"
    />
    <path
      d="M196 138H316V208L422 414C435 440 417 470 388 470H124C95 470 77 440 90 414L196 208V138Z"
      stroke="#18495A"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <!-- Flask Lip Ring -->
    <rect x="170" y="116" width="172" height="32" rx="16" fill="#E9FBFF" stroke="#18495A" stroke-width="6" />

    <!-- Specular Gloss Streak Left Side -->
    <path d="M214 166V214L128 398" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
