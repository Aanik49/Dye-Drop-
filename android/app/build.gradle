plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dyedrop.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.dyedrop.game"
        // Supports Android 5.0 Lollipop (API 21) through Android 15 / Latest (API 35+)
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
